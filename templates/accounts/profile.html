{% extends 'base.html' %}
{% block content %}
<h2>Профіль: {{ user.username }}</h2>
{% if user.profile.avatar %}
    <img src="{{ user.profile.avatar.url }}" width="100" alt="Аватар">
{% endif %}
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ u_form.as_p }}
    {{ p_form.as_p }}
    <button type="submit">Зберегти</button>
</form>
{% endblock %}
